<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEO El Nuevo Rumbo</title>
  <meta name="description" content="Acompaña a TEO en una aventura que cambiará la forma de enfrentar los desafíos de su comunidad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="topbar" id="topbar" hidden>
    <img class="topbar__logo" src="assets/img/logo_teo_elnuevorumbo.jpg" alt="TEO El Nuevo Rumbo">
    <div class="topbar__info">
      <span class="topbar__name" id="who"></span>
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
    </div>
    <button class="btn btn--ghost btn--small" id="logout" type="button" aria-label="Cambiar participante">Cambiar <span class="only-wide">participante</span></button>
  </header>

  <main id="main" tabindex="-1">
    <!-- Bienvenida -->
    <section class="screen screen--welcome" id="screen-welcome" hidden>
      <div class="welcome">
        <img class="welcome__logo" id="welcome-logo" alt="TEO El Nuevo Rumbo" width="900" height="676">
        <h1 class="visually-hidden">TEO El Nuevo Rumbo</h1>
        <p class="welcome__intro" id="welcome-intro"></p>
        <button class="btn btn--primary btn--big" id="btn-start" type="button"></button>
      </div>
    </section>

    <!-- Registro -->
    <section class="screen screen--welcome" id="screen-register" hidden>
      <form class="card register" id="register-form" novalidate>
        <h1 class="h1">Antes de empezar</h1>
        <p class="muted">Escribe tu DNI y tu nombre para guardar tu avance.</p>
        <label class="field">
          <span>DNI</span>
          <input id="dni" name="dni" inputmode="numeric" autocomplete="off" maxlength="8" pattern="\d{8}" required aria-describedby="dni-error">
          <span class="field__error" id="dni-error"></span>
        </label>
        <label class="field">
          <span>Nombre</span>
          <input id="name" name="name" autocomplete="name" maxlength="100" required aria-describedby="name-error">
          <span class="field__error" id="name-error"></span>
        </label>
        <div class="row">
          <button class="btn btn--ghost" type="button" id="btn-register-back">Volver</button>
          <button class="btn btn--primary" type="submit">Ingresar</button>
        </div>
      </form>
    </section>

    <!-- Mapa -->
    <section class="screen screen--map" id="screen-map" hidden>
      <div class="map-head">
        <div>
          <h1 class="h1">El recorrido de TEO</h1>
          <p class="map-hint" id="map-hint"></p>
        </div>
        <div class="map-head__side">
          <div class="progress" id="progress" aria-live="polite"></div>
          <div class="map-actions" id="map-actions"></div>
        </div>
      </div>
      <div class="map-scroll" id="map-scroll">
        <div class="map" id="map"></div>
      </div>
    </section>

    <!-- Reto final -->
    <section class="screen" id="screen-exam" hidden>
      <form class="card exam" id="exam-form">
        <h1 class="h1">Reto Final</h1>
        <p id="exam-intro"></p>
        <p class="muted" id="exam-attempts"></p>
        <div id="exam-questions"></div>
        <div class="row">
          <button class="btn btn--ghost" type="button" id="btn-exam-back">Volver al mapa</button>
          <button class="btn btn--primary" type="submit" id="btn-submit" disabled></button>
        </div>
      </form>
    </section>

    <!-- Resultado -->
    <section class="screen" id="screen-result" hidden>
      <div class="card result" id="result"></div>
    </section>
  </main>

  <!-- Libro -->
  <dialog class="book" id="book" aria-labelledby="book-title">
    <div class="book__inner">
      <button class="book__close" id="book-close" type="button" aria-label="Cerrar libro">×</button>
      <p class="book__kicker" id="book-kicker"></p>
      <h2 class="book__title" id="book-title"></h2>
      <div class="book__pages" id="book-pages"></div>
      <div class="book__foot">
        <button class="btn btn--primary" id="book-continue" type="button"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
